<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The chrome around the page: the address bar, the task-switcher card,
         the strip revealed by pull-to-refresh. `--sunken` in each scheme —
         the colour the page ground actually is. White and black were a shade
         off in one direction and several in the other, which showed as a seam
         where the app met the system. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d10" />
    <meta name="description" content="A focus app for ADHD brains. Starting is the feature." />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Squirrel</title>
  </head>
